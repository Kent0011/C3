<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Room Reserve System - 予約画面</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/landing.css') }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* app.html specific styles */
      body {
        background-color: var(--bg-light);
      }

      .dashboard-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 30px;
        margin-top: 40px;
        margin-bottom: 40px;
        width: 100%; /* Ensure grid takes full width */
        min-width: 0; /* Prevents grid items from overflowing */
      }
      .dashboard-card {
        background-color: var(--white);
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        border: 1px solid var(--border-color);
        /* Ensure card contents are contained */
        width: 100%;
        box-sizing: border-box;
        overflow: hidden; /* Hide overflow from children if necessary */
      }

      .dashboard-card h2 {
        font-size: 1.5em;
        margin-bottom: 20px;
        color: var(--primary-color);
        border-bottom: 2px solid var(--bg-light);
        padding-bottom: 10px;
      }

      /* Form Styles */
      label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #555;
      }

      input[type="date"],
      select {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        margin-bottom: 15px;
        font-size: 1rem;
        box-sizing: border-box;
      }

      /* Table Styles */
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
      }

      th,
      td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid var(--border-color);
      }

      th {
        background-color: var(--bg-light);
        font-weight: bold;
        color: #555;
      }

      tr:hover {
        background-color: #f9f9f9;
      }

      /* Utility */
      .btn-sm {
        padding: 5px 10px;
        font-size: 0.85rem;
      }

      .error-message {
        color: #dc3545;
        background-color: #f8d7da;
        border: 1px solid #f5c6cb;
        padding: 10px;
        border-radius: 4px;
        margin-top: 10px;
        white-space: pre-wrap;
      }

      .status-message {
        margin-left: 10px;
        font-weight: bold;
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        border-bottom: 2px solid var(--bg-light);
        padding-bottom: 10px;
      }

      .section-header h2 {
        margin-bottom: 0;
        border-bottom: none;
        padding-bottom: 0;
      }

      /* Danger Button */
      .btn-danger-outline {
        background-color: transparent;
        color: #dc3545;
        border-color: #dc3545;
      }

      .btn-danger-outline:hover {
        background-color: #dc3545;
        color: #fff;
      }

      .btn-disabled {
        background-color: #cccccc !important;
        border-color: #cccccc !important;
        color: #666666 !important;
        cursor: not-allowed !important;
        opacity: 0.7;
        pointer-events: none;
      }

      /* Alert Styles */
      .alert {
        padding: 15px;
        margin-bottom: 20px;
        border: 1px solid transparent;
        border-radius: 4px;
      }

      .alert-danger {
        color: #721c24;
        background-color: #f8d7da;
        border-color: #f5c6cb;
      }

      .user-info-display {
        display: flex;
        gap: 15px;
        align-items: center;
        margin-right: 15px;
        font-size: 0.95rem;
      }

      /* Timeline View Styles */
      .timeline-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow-x: auto;
        padding-bottom: 10px;
        /* Ensure scrolling works */
        width: 100%;
      }
      .timeline-time-header {
        display: flex;
        margin-left: 80px; /* Space for room label */
        border-bottom: 1px solid #ddd;
        padding-bottom: 5px;
        /* Double the width to stretch the scale */
        min-width: 1200px;
      }
      .timeline-time-label {
        flex: 1;
        font-size: 0.75rem;
        color: #888;
        text-align: left;
        border-left: 1px solid #eee;
        padding-left: 2px;
      }
      .timeline-row {
        display: flex;
        align-items: center;
        height: 40px;
        /* Match the header width */
        min-width: 1200px;
      }
      .timeline-room-label {
        width: 80px;
        font-weight: bold;
        font-size: 0.9rem;
        flex-shrink: 0;
      }
      .timeline-track-container {
        flex: 1;
        height: 100%;
        background-color: #f5f5f5;
        position: relative;
        border-radius: 4px;
        border: 1px solid #eee;
      }
      .timeline-block {
        position: absolute;
        top: 5px;
        bottom: 5px;
        background-color: #aaa;
        border-radius: 3px;
        font-size: 0.75rem;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        white-space: nowrap;
        cursor: pointer;
      }
      .timeline-block.my-reservation {
        background-color: var(--primary-color);
        z-index: 2;
      }
      .timeline-block.other-reservation {
        background-color: #999;
      }
      /* Tooltip or simple title is used for details */

      /* Responsive Styles for narrow screens */
      @media (max-width: 750px) {
        /* Reduce base font size */
        body {
          font-size: 14px;
        }
        .logo {
          font-size: 1.3em;
        }
        .dashboard-card h2 {
          font-size: 1.3em;
        }

        .container {
          padding: 0 15px; /* landing.css override might need !important if specificity issue, but 15px is fine */
        }
        .header .container {
          flex-direction: column;
          height: auto;
          padding: 15px;
          gap: 15px;
        }
        .nav {
          width: 100%;
          justify-content: space-between;
          flex-wrap: wrap; /* Allow wrapping if user name is long */
        }
        .user-info-display {
          margin-right: 0;
          font-size: 0.9rem;
          flex-wrap: wrap;
        }

        .dashboard-grid {
          margin-top: 20px;
          margin-bottom: 20px;
          gap: 20px;
        }
        .dashboard-card {
          padding: 15px; /* Reduce padding on mobile */
        }
        .section-header {
          flex-direction: column;
          align-items: flex-start;
          gap: 10px;
        }
        .section-header button {
          align-self: flex-start;
          width: 100%;
        }
        /* Make form elements easier to tap */
        select,
        input[type="date"],
        button {
          min-height: 44px;
        }

        /* Timeline specific */
        .timeline-container {
          /* Just to ensure it doesn't break layout */
        }

        /* Table responsive wrapper needed? It is already in overflow-x:auto div */
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <h1 class="logo">Room Reserve System</h1>
        <nav class="nav" style="align-items: center">
          <div class="user-info-display">
            <span>User: <strong>{{ user_id }}</strong></span>
            <span id="headerPenalty">累積ペナルティ: -</span>
          </div>
          <a href="/logout" class="btn btn-outline btn-sm">ログアウト</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="container">
        <div
          id="globalBanAlert"
          class="alert alert-danger"
          style="display: none"
        ></div>

        <div class="dashboard-grid">
          <!-- 1. 予約作成 -->
          <div class="dashboard-card">
            <h2>1. 予約作成</h2>

            <label for="roomIdSelect">会議室:</label>
            <select id="roomIdSelect">
              <option value="Room-A">Room-A</option>
              <option value="Room-B">Room-B</option>
              <option value="Room-C">Room-C</option>
            </select>

            <label for="resDate">日付:</label>
            <input id="resDate" type="date" />

            <label for="startTimeSelect">開始時刻:</label>
            <select id="startTimeSelect"></select>

            <label for="durationSelect">利用時間（分）:</label>
            <select id="durationSelect"></select>

            <div style="margin-top: 20px">
              <button
                onclick="createReservation()"
                class="btn btn-primary"
                style="width: 100%"
              >
                予約する
              </button>
            </div>
            <div
              id="createMessage"
              style="margin-top: 10px; text-align: center"
            ></div>
          </div>

          <!-- 2. 予約状況 -->
          <div class="dashboard-card">
            <div class="section-header">
              <h2>2. 予約状況</h2>
              <button onclick="loadTimeline()" class="btn btn-outline btn-sm">
                更新
              </button>
            </div>
            <p style="font-size: 0.9rem; color: #666; margin-bottom: 10px">
              日付:
              <span id="timelineDateDisplay" style="font-weight: bold">--</span>
            </p>
            <div id="timelineView" class="timeline-container">
              <!-- Timeline rendered by JS -->
            </div>
          </div>
        </div>

        <div class="dashboard-grid">
          <!-- 3. 自分の予約一覧 -->
          <div class="dashboard-card" style="grid-column: 1 / -1">
            <div class="section-header">
              <h2>3. 自分の予約一覧</h2>
              <button
                onclick="loadReservations()"
                class="btn btn-outline btn-sm"
              >
                更新
              </button>
            </div>
            <div style="overflow-x: auto">
              <table id="reservationsTable">
                <thead>
                  <tr>
                    <th>予約ID</th>
                    <th>会議室</th>
                    <th>開始日時</th>
                    <th>終了日時</th>
                    <th>ステータス</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
            <pre
              id="reservationError"
              class="error-message"
              style="display: none"
            ></pre>
          </div>

          <!-- 4. ペナルティ状況 (削除済) -->
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <p>&copy; 2025 Room Reserve System. All rights reserved.</p>
      </div>
    </footer>

    <script>
      const user_id = "{{ user_id }}";

      // Error message handling helper
      function showError(elementId, message) {
        const el = document.getElementById(elementId);
        if (message) {
          el.textContent = message;
          el.style.display = "block";
        } else {
          el.style.display = "none";
        }
      }

      // Overwrite standard pre tags behavior if needed, or rely on app.js
    </script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
